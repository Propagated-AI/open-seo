services:
  - type: web
    name: propagated-openseo
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: standard
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /healthz
    disk:
      name: openseo-state
      mountPath: /app/.wrangler
      sizeGB: 1
    envVars:
      - key: DATAFORSEO_API_KEY
        sync: false
      - key: TEAM_DOMAIN
        sync: false
      - key: POLICY_AUD
        sync: false
      - key: RENDER_MAINTENANCE_KEY
        generateValue: true
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: cloudflare_access
      - key: CLOUDFLARE_INCLUDE_PROCESS_ENV
        value: "true"
      - key: OPENSEO_TELEMETRY_DISABLED
        value: "1"
      - key: VITE_SHOW_DEVTOOLS
        value: "false"
      - key: PORT
        value: "10000"
